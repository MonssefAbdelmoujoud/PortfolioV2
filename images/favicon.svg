<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- a gold koi in blocks, like the ones in the pond: head right, fins and tail lighter -->
  <rect width="16" height="16" rx="3" fill="#0b0b0c"/>
  <g transform="translate(1 0)">
  <g fill="#d9b84a">
    <rect x="9" y="5" width="3" height="1"/>
    <rect x="6" y="6" width="7" height="1"/>
    <rect x="3" y="7" width="11" height="2"/>
    <rect x="6" y="9" width="7" height="1"/>
    <rect x="9" y="10" width="3" height="1"/>
  </g>
  <g fill="#d9b84a" opacity=".5">
    <rect x="10" y="4" width="2" height="1"/>
    <rect x="10" y="11" width="2" height="1"/>
    <rect x="1" y="6" width="2" height="1"/>
    <rect x="0" y="5" width="2" height="1"/>
    <rect x="1" y="9" width="2" height="1"/>
    <rect x="0" y="10" width="2" height="1"/>
    <rect x="2" y="7" width="1" height="2"/>
  </g>
  <g fill="#0b0b0c">
    <rect x="11" y="6" width="1" height="1"/>
    <rect x="11" y="9" width="1" height="1"/>
  </g>
  </g>
</svg>
